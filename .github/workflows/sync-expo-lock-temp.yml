name: Temporary Expo dependency lock sync
on:
  push:
    branches: [fix/security-onboarding-push-2026]
    paths:
      - .github/workflows/sync-expo-lock-temp.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-onboarding-push-2026
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh lockfile without changing SDK major
        working-directory: GestorApp
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm dedupe --package-lock-only --ignore-scripts --no-fund --no-audit
          npm ci --ignore-scripts --no-fund --no-audit
      - name: Save synchronized npm lockfile
        run: |
          if git diff --quiet -- GestorApp/package-lock.json; then
            echo 'No lock changes required'
            exit 0
          fi
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add GestorApp/package-lock.json
          git commit -m 'fix(deps): sync SDK 56 native package lockfile'
          git push origin HEAD:fix/security-onboarding-push-2026
