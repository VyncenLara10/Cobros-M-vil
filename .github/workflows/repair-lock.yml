name: Temporary repair package lock
on:
  push:
    branches: [fix/security-onboarding-push-2026]
    paths:
      - '.github/workflows/repair-lock.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/security-onboarding-push-2026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-onboarding-push-2026
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lock metadata only
        working-directory: GestorApp
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lock to this feature branch
        run: |
          if git diff --quiet -- GestorApp/package-lock.json; then
            echo "Lock already synchronized"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add GestorApp/package-lock.json
          git commit -m "fix(deps): synchronize Expo npm lockfile"
          git push origin HEAD:fix/security-onboarding-push-2026
