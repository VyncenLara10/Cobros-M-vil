name: Verify Expo app
on:
  pull_request:
    paths:
      - 'GestorApp/**'
      - '.github/workflows/expo-check.yml'
  push:
    branches: [main]
    paths:
      - 'GestorApp/**'
      - '.github/workflows/expo-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GestorApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: GestorApp/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Expo lint
        run: npm run lint
